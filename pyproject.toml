[project]
name = "pump-sentinel"
version = "1.0.0"
description = "Pump health monitoring API — CI/CD teaching demo"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
